name: balcony-deploy-control-fleet-gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  activate-shipverify-structure:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Structural — activate-production invokes post-activate shipVerify
        run: |
          set -euo pipefail
          grep -q 'run_post_activate_ship_verify' scripts/activate-production.sh
          grep -q 'post-activate-ship-verify.sh' scripts/activate-production.sh
          grep -q 'resolve_repos_root' scripts/post-activate-ship-verify.sh
          grep -q 'fleetctl' scripts/post-activate-ship-verify.sh
          grep -q 'ship-verify balcony' scripts/post-activate-ship-verify.sh

      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/activation/go.mod
          cache: false
      - name: Test activation evidence and fail-closed execution
        run: |
          set -euo pipefail
          go test -C tools/activation ./... -count=1
          bash -n scripts/activate-production.sh scripts/activate-staging.sh

  fleet-gate:
    needs: [activate-shipverify-structure]
    uses: ./.github/workflows/reusable-fleet-gate.yml
    secrets: inherit
    with:
      app-name: balcony-deploy-control
      app-repo: dalexsy/balcony-deploy-control
      app-ref: ${{ github.event.pull_request.head.sha || github.sha }}
