name: heal-balcony-production

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  heal:
    runs-on: [self-hosted, staging, pi4, control]
    steps:
      - name: Checkout balcony recovery source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: dalexsy/balcony-log
          ref: main
          path: balcony-log
          ssh-key: ${{ secrets.BALCONY_LOG_READ_KEY }}
          persist-credentials: false

      - name: Select a reachable production edge (dryl-prod only — never the kiosk)
        run: |
          set -euo pipefail
          # magicmirror (192.168.178.74) is a physical kiosk display in the
          # apartment. It must never run balcony/auth/tunnel services again:
          # doing so starves its own watchdog, flaps cloudflared, and forces
          # kiosk page reloads that flash the screen bright white overnight.
          # See .cursor/rules/debugging.md (2026-08-28 kiosk-pi-misuse).
          if ssh -o BatchMode=yes -o ConnectTimeout=8 pi@192.168.178.79 true; then
            echo "BALCONY_EDGE=192.168.178.79" >> "$GITHUB_ENV"
            health=$(ssh -o BatchMode=yes -o ConnectTimeout=8 pi@192.168.178.79 \
              'curl -fsS --max-time 5 http://127.0.0.1:3838/api/health' || true)
            echo "$health"
            if echo "$health" | grep -q '"ok":true'; then
              echo "BALCONY_RECOVERY_NEEDED=0" >> "$GITHUB_ENV"
            else
              echo "BALCONY_RECOVERY_NEEDED=1" >> "$GITHUB_ENV"
            fi
          else
            echo "dryl-prod (192.168.178.79) has no LAN presence — no failover edge available."
            echo "BALCONY_NO_EDGE=1" >> "$GITHUB_ENV"
            echo "BALCONY_RECOVERY_NEEDED=1" >> "$GITHUB_ENV"
          fi

      - name: Cafe plug cycle with no production edge reachable
        if: env.BALCONY_NO_EDGE == '1'
        run: |
          set -euo pipefail
          python3 balcony-log/scripts/test-balcony-stream-plug.py
          cd balcony-log
          # Foculus agent normally proxies through dryl-prod at 127.0.0.1:8788;
          # with no edge reachable, hit the plug's own LAN address directly.
          FOCULUS_AGENT_URL="${CAFE_PLUG_LAN_URL:-http://192.168.178.43:8788}" \
            BALCONY_CAFE_STILL_DOWN=1 python3 scripts/lib/balcony_stream_plug.py || \
            echo "plug cycle failed with no edge and no direct plug route — needs physical check"
          echo "Fleet is down: dryl-prod has no LAN presence. This requires physical inspection (power/network) — no remote recovery path exists while the host itself is absent from the LAN."
          exit 1

      - name: Test and install cafe recovery scripts
        if: env.BALCONY_RECOVERY_NEEDED == '1' && env.BALCONY_NO_EDGE != '1'
        run: |
          set -euo pipefail
          python3 balcony-log/scripts/test-balcony-stream-plug.py
          python3 balcony-log/scripts/test-balcony-stream-heal-plan.py
          scp -o BatchMode=yes -o ConnectTimeout=8 \
            balcony-log/scripts/lib/balcony_stream_plug.py \
            balcony-log/scripts/lib/balcony_stream_heal.py \
            pi@$BALCONY_EDGE:/tmp/
          ssh -o BatchMode=yes -o ConnectTimeout=8 pi@$BALCONY_EDGE '
            set -euo pipefail
            install -m 0644 /tmp/balcony_stream_plug.py \
              /home/pi/balcony-log/scripts/lib/balcony_stream_plug.py
            install -m 0644 /tmp/balcony_stream_heal.py \
              /home/pi/balcony-log/scripts/lib/balcony_stream_heal.py
            state=$(curl -fsS -m 12 -X POST \
              "http://127.0.0.1:8788/api/lights/65550?power=true")
            echo "$state"
            echo "$state" | grep -q "\"power\":true"
          '

      - name: Nudge cafe camera, live-reset, and restart if still stuck
        if: env.BALCONY_RECOVERY_NEEDED == '1' && env.BALCONY_NO_EDGE != '1'
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=8 pi@$BALCONY_EDGE '
            set -euo pipefail
            echo "=== before ==="
            HEALTH_BEFORE=$(curl -fsS --max-time 5 \
              http://127.0.0.1:3838/api/health || true)
            echo "$HEALTH_BEFORE"
            echo
            if echo "$HEALTH_BEFORE" | grep -q "cafe-unreachable"; then
              echo "=== cafe plug cycle ==="
              cd /home/pi/balcony-log
              BALCONY_CAFE_STILL_DOWN=1 \
                python3 scripts/lib/balcony_stream_plug.py
              sleep 40
            fi
            echo "=== cafe restart ==="
            ssh -o BatchMode=yes -o ConnectTimeout=6 pi@192.168.178.43 \
              "curl -sf -m 5 -X POST http://127.0.0.1:8889/restart || sudo systemctl restart pi-camera" \
              || curl -sf -m 5 -X POST http://192.168.178.43:8889/restart || true
            sleep 5
            echo "=== live-reset ==="
            curl -sf -m 20 -X POST http://127.0.0.1:3838/api/live/reset && echo RESET_OK || echo RESET_FAIL
            sleep 5
            echo "=== after reset ==="
            HEALTH_AFTER=$(curl -fsS --max-time 5 http://127.0.0.1:3838/api/health || true)
            echo "$HEALTH_AFTER"
            echo
            if ! echo "$HEALTH_AFTER" | grep -q "\"ok\":true"; then
              echo "=== hard service restart (remux still not producing) ==="
              sudo systemctl restart balcony-log
            fi
            for attempt in $(seq 1 18); do
              HEALTH_AFTER=$(curl -fsS --max-time 5 \
                http://127.0.0.1:3838/api/health || true)
              echo "$HEALTH_AFTER"
              if echo "$HEALTH_AFTER" | grep -q "\"ok\":true"; then
                exit 0
              fi
              sleep 5
            done
            echo "Camera/remux recovery postcondition failed" >&2
            exit 1
          '
