name: unattended-balcony-delivery

on:
  workflow_dispatch:

permissions:
  actions: read
  attestations: write
  contents: read
  id-token: write

concurrency:
  group: balcony-zero-trust-delivery
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ steps.meta.outputs.artifact_name }}
      artifact-file: ${{ steps.meta.outputs.artifact_file }}
      artifact-digest: ${{ steps.meta.outputs.artifact_digest }}
      commit-sha: ${{ steps.meta.outputs.commit_sha }}
    steps:
      - name: Checkout balcony source read-only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: dalexsy/balcony-log
          ref: main
          path: balcony-log
          ssh-key: ${{ secrets.BALCONY_LOG_READ_KEY }}
          persist-credentials: false
          fetch-depth: 0

      - name: Checkout directory source read-only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: dalexsy/directory
          ref: main
          path: directory
          ssh-key: ${{ secrets.DIRECTORY_READ_KEY }}
          persist-credentials: false

      - name: Checkout dryl packages read-only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: dalexsy/dryl
          ref: main
          path: dryl
          ssh-key: ${{ secrets.DRYL_READ_KEY }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: balcony-log/package-lock.json

      - name: Build exact @dryl packages
        working-directory: dryl
        run: |
          set -euo pipefail
          for pkg in auth-client app-data storage; do
            (cd "$pkg" && npm ci --ignore-scripts --legacy-peer-deps --include=dev && ./node_modules/.bin/tsc -p tsconfig.json)
          done
          (cd ui && npm ci --ignore-scripts --legacy-peer-deps && npm run build:lib)

      - name: Install balcony dependencies without lifecycle scripts
        working-directory: balcony-log
        run: npm install --ignore-scripts --legacy-peer-deps --include=dev --no-audit --no-fund

      - name: Fail-closed dependency audit
        working-directory: balcony-log
        run: npm audit --audit-level=high

      - name: Run source and static policy gates
        working-directory: balcony-log
        run: |
          npm run test:zero-trust
          npm run lint:ui
          npm run lint:watch-static

      - name: Build once
        working-directory: balcony-log
        run: |
          npm run build:watch-css
          BALCONY_SKIP_WATCH_CSS=1 npm run build
          npm run verify:dist

      - name: Package content-addressed artifact
        id: meta
        run: |
          set -euo pipefail
          sha="$(git -C balcony-log rev-parse HEAD)"
          file="balcony-${sha}.tar.gz"
          node_version="$(node --version)"
          npm_version="$(npm --version)"
          printf '{"schemaVersion":1,"commitSha":"%s","node":"%s","npm":"%s"}\n' \
            "$sha" "$node_version" "$npm_version" > balcony-log/build-manifest.json
          tar -C balcony-log -czf "$file" \
            build-manifest.json dist/balcony-log/browser src/server server.ts scripts/pi-package.json
          digest="$(sha256sum "$file" | cut -d' ' -f1)"
          echo "artifact_name=balcony-build-${sha}" >> "$GITHUB_OUTPUT"
          echo "artifact_file=${file}" >> "$GITHUB_OUTPUT"
          echo "artifact_digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "commit_sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: Upload exact build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: ${{ steps.meta.outputs.artifact_file }}
          if-no-files-found: error
          retention-days: 30

  staging:
    needs: build
    runs-on: [self-hosted, staging, pi4, control]
    steps:
      - name: Checkout balcony exact SHA read-only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: dalexsy/balcony-log
          ref: ${{ needs.build.outputs.commit-sha }}
          path: balcony-log
          ssh-key: ${{ secrets.BALCONY_LOG_READ_KEY }}
          persist-credentials: false

      - name: Checkout directory read-only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: dalexsy/directory
          path: directory
          ssh-key: ${{ secrets.DIRECTORY_READ_KEY }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Ensure staging browser dependency
        run: |
          if ! command -v chromium >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq chromium
          fi
          chromium --version

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: artifact

      - name: Verify and extract exact artifact
        run: |
          set -euo pipefail
          file="artifact/${{ needs.build.outputs.artifact-file }}"
          echo "${{ needs.build.outputs.artifact-digest }}  ${file}" | sha256sum -c -
          tar -C balcony-log -xzf "$file"
          test "$(node -p "require('./balcony-log/build-manifest.json').commitSha")" = "${{ needs.build.outputs.commit-sha }}"

      - name: Install test tooling without lifecycle scripts
        working-directory: balcony-log
        run: npm install --ignore-scripts --legacy-peer-deps --include=dev --no-audit --no-fund

      - name: Verify exact dist and mobile invariants
        working-directory: balcony-log
        run: |
          npm run verify:dist
          node scripts/check-watch-mobile-layout.mjs

      - name: Layout pinch test is not stream proof
        working-directory: balcony-log
        env:
          LIVE_VIDEO: "0"
          LIVE_POLL_ONLY: "1"
          REMOTE_VIEW_PASSWORD: ""
          PORT: "3840"
          BALCONY_TEST_URL: "http://127.0.0.1:3840"
        run: |
          set -euo pipefail
          sudo fuser -k 3840/tcp 2>/dev/null || true
          setsid npm run serve > /tmp/balcony-control-layout.log 2>&1 &
          server_pid=$!
          trap 'kill -- "-${server_pid}" 2>/dev/null || true' EXIT
          npx wait-on http://127.0.0.1:3840/watch --timeout 45000
          npm run verify:watch-mobile-layout

      - name: Prove live cafe remux on staging hostname
        working-directory: balcony-log
        env:
          LIVE_VIDEO: "1"
          LIVE_STREAM_URL: "tcp/h264://192.168.178.43:8888"
          LIVE_POLL_ONLY: "1"
          REMOTE_VIEW_PASSWORD: ""
          BALCONY_PUBLIC_URL: "http://balcony.staging.dryl.io"
          BALCONY_MIN_SCREEN_FPS: "10"
          WATCH_SCREENSHOT_DIR: ${{ github.workspace }}/balcony-log/artifacts/staging-stream
        run: |
          set -euo pipefail
          test "${LIVE_VIDEO}" = "1"
          mkdir -p artifacts/staging-stream
          python scripts/assert-cafe-live-h264.py | tee artifacts/staging-stream/cafe-h264.json
          npm run verify:screen-fps
          STAGING_FPS_JSON=artifacts/staging-stream/latest-screen-fps-result.json \
          STAGING_CAFE_JSON=artifacts/staging-stream/cafe-h264.json \
          STAGING_STREAM_JSON=artifacts/staging-stream/stream.json \
            node scripts/collect-staging-stream-evidence.mjs
          EXPECTED_COMMIT_SHA="${{ needs.build.outputs.commit-sha }}" \
          EXPECTED_ARTIFACT_DIGEST="${{ needs.build.outputs.artifact-digest }}" \
          STAGING_STREAM_JSON=artifacts/staging-stream/stream.json \
            node scripts/write-staging-stream-audit.mjs "${{ github.workspace }}/staging-audit/audit.json"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: staging-audit
          path: staging-audit/audit.json
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mobile-layout-evidence
          path: balcony-log/artifacts/mobile-layout
          if-no-files-found: error
          retention-days: 30

  promote:
    needs: [build, staging]
    uses: ./.github/workflows/promote.yml
    with:
      artifact-name: ${{ needs.build.outputs.artifact-name }}
      artifact-file: ${{ needs.build.outputs.artifact-file }}
      artifact-digest: ${{ needs.build.outputs.artifact-digest }}
      staging-audit-name: staging-audit
      commit-sha: ${{ needs.build.outputs.commit-sha }}

  activate:
    needs: [build, staging, promote]
    runs-on: [self-hosted, staging, pi4, control]
    steps:
      - name: Checkout control activate script
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: dalexsy/balcony-deploy-control
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: artifact

      - name: Activate exact attested artifact on production
        run: |
          chmod +x scripts/activate-production.sh
          scripts/activate-production.sh \
            "artifact/${{ needs.build.outputs.artifact-file }}" \
            "${{ needs.build.outputs.artifact-digest }}" \
            "${{ needs.build.outputs.commit-sha }}"

  verify-production:
    needs: [build, staging, promote, activate]
    runs-on: [self-hosted, staging, pi4, control]
    steps:
      - name: Checkout balcony exact SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: dalexsy/balcony-log
          ref: ${{ needs.build.outputs.commit-sha }}
          path: balcony-log
          ssh-key: ${{ secrets.BALCONY_LOG_READ_KEY }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Install verify tooling
        working-directory: balcony-log
        run: npm install --ignore-scripts --legacy-peer-deps --include=dev --no-audit --no-fund

      - name: Public /watch screen FPS after production activate
        working-directory: balcony-log
        env:
          BALCONY_PUBLIC_URL: "https://balcony.dryl.io"
          BALCONY_MIN_SCREEN_FPS: "10"
          LIVE_POLL_ONLY: "1"
        run: npm run verify:screen-fps
