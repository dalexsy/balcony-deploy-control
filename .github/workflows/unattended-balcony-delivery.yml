name: unattended-balcony-delivery

on:
  workflow_dispatch:
    inputs:
      ref:
        description: balcony-log git ref (branch or full SHA)
        type: string
        default: main
      layer:
        description: "auto = static UI when prod SHA matches; restart = remux bounce + shipVerify"
        type: choice
        options:
          - auto
          - static
          - restart
        default: auto

permissions:
  contents: read

concurrency:
  group: balcony-zero-trust-delivery
  cancel-in-progress: false

jobs:
  build:
    # Pin 24.04 until fleet validates ubuntu-26 (actions/runner-images#14748).
    runs-on: ubuntu-24.04
    outputs:
      artifact-file: ${{ steps.meta.outputs.artifact_file }}
      artifact-digest: ${{ steps.meta.outputs.artifact_digest }}
      commit-sha: ${{ steps.meta.outputs.commit_sha }}
      watch-asset-version: ${{ steps.meta.outputs.watch_asset_version }}
    steps:
      - name: Checkout activation tooling
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          path: control
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: control/tools/activation/go.mod
          cache: false

      - name: Test and build activation checks
        run: |
          set -euo pipefail
          go test -C control/tools/activation ./...
          go build -C control/tools/activation -o "$RUNNER_TEMP/activation-check" .

      - name: Checkout balcony source read-only
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: dalexsy/balcony-log
          ref: ${{ github.event.inputs.ref || 'main' }}
          path: balcony-log
          ssh-key: ${{ secrets.BALCONY_LOG_READ_KEY }}
          persist-credentials: false
          fetch-depth: 0

      - name: Checkout dryl packages read-only
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: dalexsy/dryl
          ref: main
          path: dryl
          ssh-key: ${{ secrets.DRYL_READ_KEY }}
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: balcony-log/package-lock.json

      - name: Build exact @dryl packages
        working-directory: dryl
        run: |
          set -euo pipefail
          for pkg in auth-client app-data storage; do
            (cd "$pkg" && npm ci --ignore-scripts --legacy-peer-deps --include=dev && ./node_modules/.bin/tsc -p tsconfig.json)
          done
          (cd ui && npm ci --ignore-scripts --legacy-peer-deps --include=dev && npx ng build @dryl/ui)
          rm -rf ui/dist/dryl/ui
          cp -a ui/dist/dryl/ui-staging ui/dist/dryl/ui
          mkdir -p ui/dist/dryl/ui/src/lib
          cp -a ui/projects/dryl/ui/src/lib/styles ui/dist/dryl/ui/src/lib/styles
          "$RUNNER_TEMP/activation-check" style-package ui/dist/dryl/ui/package.json
          test -f ui/dist/dryl/ui/package.json
          test -f ui/dist/dryl/ui/src/lib/styles/index.scss

      - name: Checkout directory read-only (fleet-ng-build-gate)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: dalexsy/directory
          ref: main
          path: directory
          ssh-key: ${{ secrets.DIRECTORY_READ_KEY }}
          persist-credentials: false

      - name: Install balcony dependencies without lifecycle scripts
        working-directory: balcony-log
        run: npm install --ignore-scripts --legacy-peer-deps --include=dev --no-audit --no-fund

      - name: Verify built commit matches dispatch ref
        working-directory: balcony-log
        env:
          BUILD_REF: ${{ github.event.inputs.ref || 'main' }}
        run: |
          set -euo pipefail
          built="$(git rev-parse HEAD)"
          ref="$BUILD_REF"
          if echo "$ref" | grep -Eq '^[0-9a-f]{40}$'; then
            want="$(git rev-parse "$ref")"
            test "$built" = "$want"
          fi
          echo "built_sha=${built}"

      - name: Check watch source and generated bundles
        working-directory: balcony-log
        run: |
          set -euo pipefail
          npm run typecheck:watch
          npm run test:watch-human-presence
          npm run test:watch-viewer-return
          npm run test:watch-frame-dedupe
          npm run test:watch-weather-retry
          npm run lint:watch-static

      - name: Build Angular dist (watch static ships from git at this SHA)
        working-directory: balcony-log
        env:
          INIT_CWD: ${{ github.workspace }}/balcony-log
        run: |
          set -euo pipefail
          go run -C ../directory/tools/fleet-ng-build-gate . build --configuration production
          test -d dist/balcony-log/browser

      - name: Stamp dist dryl-build-version.json (health + shipVerify identity)
        working-directory: balcony-log
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          main="$(basename "$(ls dist/balcony-log/browser/main-*.js | head -1)")"
          ver="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          printf '{"app":"balcony","version":"%s","sha":"%s","main":"%s","label":"Balcony live"}\n' \
            "$ver" "$sha" "$main" > dist/balcony-log/browser/dryl-build-version.json
          test -s dist/balcony-log/browser/dryl-build-version.json

      - name: Package content-addressed artifact
        id: meta
        run: |
          set -euo pipefail
          sha="$(git -C balcony-log rev-parse HEAD)"
          asset="$(sed -n 's/.*WATCH_ASSET_VERSION = "\([^"]*\)".*/\1/p' \
            balcony-log/src/server/watch/watch-asset-version.ts)"
          test -n "$asset"
          file="balcony-${sha}.tar.gz"
          printf '{"commitSha":"%s","watchAssetVersion":"%s"}\n' \
            "$sha" "$asset" > balcony-log/build-manifest.json
          mkdir -p balcony-log/tools
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -C control/tools/activation \
            -o "$GITHUB_WORKSPACE/balcony-log/tools/activation-check" .
          tar -C balcony-log -czf "$file" \
            build-manifest.json dist/balcony-log/browser src/server server.ts \
            scripts/pi-package.json tools/activation-check
          digest="$(sha256sum "$file" | cut -d' ' -f1)"
          echo "artifact_file=${file}" >> "$GITHUB_OUTPUT"
          echo "artifact_digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "commit_sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "watch_asset_version=${asset}" >> "$GITHUB_OUTPUT"

      - name: Upload exact build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: balcony-build-${{ steps.meta.outputs.commit_sha }}
          path: ${{ steps.meta.outputs.artifact_file }}
          if-no-files-found: error
          retention-days: 30

  staging:
    needs: build
    runs-on: [self-hosted, staging, pi4, control]
    steps:
      - name: Checkout control plane scripts
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: balcony-build-${{ needs.build.outputs.commit-sha }}
          path: artifact
      - name: Activate and verify the candidate on staging
        run: |
          set -euo pipefail
          bash scripts/activate-staging.sh \
            "artifact/${{ needs.build.outputs.artifact-file }}" \
            "${{ needs.build.outputs.artifact-digest }}" \
            "${{ needs.build.outputs.commit-sha }}" \
            "${{ needs.build.outputs.watch-asset-version }}" restart

  activate:
    needs: [build, staging]
    runs-on: [self-hosted, staging, pi4, control]
    env:
      REPOS_ROOT: ${{ github.workspace }}
      DRYL_PASS: ${{ secrets.DRYL_PASS }}
      AGENT_DRYL_USER: ${{ secrets.AGENT_DRYL_USER }}
      AGENT_DRYL_PASS: ${{ secrets.AGENT_DRYL_PASS }}
    steps:
      - name: Checkout control plane scripts
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          path: control

      - name: Checkout balcony exact SHA read-only
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: dalexsy/balcony-log
          ref: ${{ needs.build.outputs.commit-sha }}
          path: balcony-log
          ssh-key: ${{ secrets.BALCONY_LOG_READ_KEY }}
          persist-credentials: false

      - name: Checkout directory read-only (manifest shipVerify)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: dalexsy/directory
          ref: main
          path: directory
          ssh-key: ${{ secrets.DIRECTORY_READ_KEY }}
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: balcony-build-${{ needs.build.outputs.commit-sha }}
          path: artifact

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"

      - name: Set up Go for fleetctl ship-verify
        uses: actions/setup-go@v5
        with:
          go-version-file: directory/tools/fleetctl/go.mod
          cache: false

      - name: Install balcony verify tooling
        working-directory: balcony-log
        run: npm install --ignore-scripts --legacy-peer-deps --include=dev --no-audit --no-fund

      - name: Install Playwright Chromium for HLS decode verify
        working-directory: balcony-log
        run: npx playwright-core install chromium

      - name: Resolve activate mode
        id: mode
        env:
          BUILD_REF: ${{ github.event.inputs.ref || 'main' }}
          BUILD_LAYER: ${{ github.event.inputs.layer || 'auto' }}
        run: |
          set -euo pipefail
          go build -C control/tools/activation -o "$RUNNER_TEMP/activation-check" .
          layer="$BUILD_LAYER"
          ref="$BUILD_REF"
          if [ "$layer" = "auto" ]; then
            prod_sha="$(ssh -o BatchMode=yes -o ConnectTimeout=8 pi@192.168.178.79 \
              'curl -fsS --max-time 3 http://127.0.0.1:3838/api/build-manifest' \
              | "$RUNNER_TEMP/activation-check" field commitSha || true)"
            if [ "$prod_sha" = "${{ needs.build.outputs.commit-sha }}" ]; then
              layer=static
            else
              layer=restart
            fi
          fi
          # Pinned SHA deliveries must restart + cold shipVerify (never static-skip).
          if echo "$ref" | grep -Eq '^[0-9a-f]{40}$'; then
            layer=restart
          fi
          echo "mode=${layer}" >> "$GITHUB_OUTPUT"
          echo "[resolve] ref=${ref} commit=${{ needs.build.outputs.commit-sha }} mode=${layer}"

      - name: Activate attested artifact on production
        id: activate
        run: |
          set -euo pipefail
          file="artifact/${{ needs.build.outputs.artifact-file }}"
          echo "${{ needs.build.outputs.artifact-digest }}  ${file}" | sha256sum -c -
          chmod +x control/scripts/activate-production.sh
          control/scripts/activate-production.sh \
            "$file" \
            "${{ needs.build.outputs.artifact-digest }}" \
            "${{ needs.build.outputs.commit-sha }}" \
            "${{ steps.mode.outputs.mode }}" \
            2>&1 | tee /tmp/balcony-activate.log

      - name: Fail-closed post-activate shipVerify log lines
        run: |
          set -euo pipefail
          grep -q '\[activate\] post-activate manifest shipVerify' /tmp/balcony-activate.log
          grep -q '\[shipVerify\] ok balcony' /tmp/balcony-activate.log
          echo "[ok] post-activate manifest shipVerify passed"
