name: zero-trust-balcony-promote

on:
  workflow_call:
    inputs:
      artifact-name:
        required: true
        type: string
      artifact-file:
        required: true
        type: string
      artifact-digest:
        required: true
        type: string
      staging-audit-name:
        required: true
        type: string
      commit-sha:
        required: true
        type: string

permissions:
  actions: read
  attestations: write
  contents: read
  id-token: write

jobs:
  verify-and-request-production:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout immutable control plane
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: dalexsy/balcony-deploy-control
          ref: ${{ github.workflow_sha }}
          path: control

      - name: Download immutable build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ inputs.artifact-name }}
          path: evidence/build

      - name: Download staging attestation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ inputs.staging-audit-name }}
          path: evidence/staging

      - name: Verify caller, SHA, digest, and staging evidence
        run: |
          node control/scripts/verify-promotion.mjs \
            --sha="${{ inputs.commit-sha }}" \
            --digest="${{ inputs.artifact-digest }}" \
            --artifact="evidence/build/${{ inputs.artifact-file }}" \
            --staging="evidence/staging/audit.json" \
            --out="control-audit.json"

      - name: Attest exact build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: evidence/build/${{ inputs.artifact-file }}

      - name: Publish immutable control evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: control-audit
          path: control-audit.json
          if-no-files-found: error
          retention-days: 90

      - name: Mint unused OIDC token so the job cannot skip identity
        run: |
          set -euo pipefail
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          curl -fsS \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=dryl-balcony-deploy" \
            >/tmp/oidc.json
          test -s /tmp/oidc.json
