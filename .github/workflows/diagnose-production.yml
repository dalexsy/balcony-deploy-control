name: diagnose-balcony-production

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, staging, pi4, control]
    steps:
      - name: Capture production service and process evidence
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=8 pi@192.168.178.79 '
            set -u
            date
            echo "=== health ==="
            curl -fsS --max-time 5 http://127.0.0.1:3838/api/health || true
            echo
            echo "=== thermal ==="
            vcgencmd measure_temp || true
            vcgencmd get_throttled || true
            vcgencmd measure_clock arm || true
            echo "=== processes ==="
            ps -eo pid,ppid,%cpu,%mem,etime,stat,comm,args --sort=-%cpu | head -n 25
            echo "=== service ==="
            systemctl status balcony-log --no-pager || true
            systemctl show balcony-log -p NRestarts,ActiveEnterTimestamp,ExecMainStatus || true
            echo "=== journal ==="
            sudo journalctl -u balcony-log -n 200 --no-pager || true
          '
