name: reusable-fleet-gate

on:
  workflow_call:
    inputs:
      app-name:
        description: Application folder / site id
        required: true
        type: string
      app-repo:
        required: false
        type: string
        default: ""
      app-ref:
        required: false
        type: string
        default: ""
      app-path:
        required: false
        type: string
        default: "."

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "false"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  DRYL_ENV: staging

permissions:
  contents: read

concurrency:
  group: fleet-gate-${{ inputs.app-name }}
  cancel-in-progress: true

jobs:
  semantic-quality:
    name: commitlint-${{ inputs.app-name }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app source read-only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ inputs.app-repo != '' && inputs.app-repo || format('dalexsy/{0}', inputs.app-name) }}
          ref: ${{ inputs.app-ref != '' && inputs.app-ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"

      - name: Fail-closed commitlint and reject wip history
        working-directory: ${{ inputs.app-path }}
        run: |
          set -euo pipefail
          test -f package.json
          npm install --ignore-scripts --no-audit --no-fund --legacy-peer-deps \
            @commitlint/cli@21.2.2 @commitlint/config-conventional@21.2.2
          if [[ ! -f commitlint.config.cjs && ! -f commitlint.config.js && ! -f .commitlintrc.json ]]; then
            printf '%s\n' 'module.exports = { extends: ["@commitlint/config-conventional"] };' \
              > commitlint.config.cjs
          fi
          BASE="$(git merge-base HEAD origin/main 2>/dev/null || git rev-list --max-parents=0 HEAD)"
          npx commitlint --from "${BASE}" --to HEAD
          if git log --format=%s "${BASE}..HEAD" | grep -Eiq '(^|[[:space:]])(wip|updates?)([[:space:]]|:|$)|auto-commit wip'; then
            echo "non-conventional history in ${{ inputs.app-name }}"
            git log --format=%s "${BASE}..HEAD" | grep -Ei '(^|[[:space:]])(wip|updates?)([[:space:]]|:|$)|auto-commit wip' || true
            exit 1
          fi

  scale-gate:
    name: scale-200-500-${{ inputs.app-name }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app source read-only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ inputs.app-repo != '' && inputs.app-repo || format('dalexsy/{0}', inputs.app-name) }}
          ref: ${{ inputs.app-ref != '' && inputs.app-ref || github.sha }}
          persist-credentials: false

      - name: Fail if any source file exceeds 200 lines
        working-directory: ${{ inputs.app-path }}
        run: |
          set -euo pipefail
          if [[ -f scripts/check-max-lines.mjs ]]; then
            node scripts/check-max-lines.mjs
            exit 0
          fi
          python3 - <<'PY'
          import os, sys
          SKIP_DIRS = {
              "node_modules", "dist", "build", ".git", ".angular", ".gradle",
              "static", "coverage", "storybook-static",
          }
          EXTS = {".ts", ".html", ".scss", ".js", ".mjs", ".kt"}
          root = os.getcwd()
          file_hits = []
          scan_roots = ["src", os.path.join("functions", "src"), os.path.join("app", "src", "main")]
          for rel_root in scan_roots:
            source_root = os.path.join(root, rel_root)
            if not os.path.isdir(source_root):
              continue
            for dirpath, dirnames, filenames in os.walk(source_root):
              dirnames[:] = [d for d in dirnames if d not in SKIP_DIRS and not d.startswith(".")]
              for name in filenames:
                ext = os.path.splitext(name)[1].lower()
                if ext not in EXTS or name.endswith(".min.js") or name == "dryl-ui.mjs":
                  continue
                if ".spec." in name or ".generated." in name:
                  continue
                path = os.path.join(dirpath, name)
                with open(path, "r", encoding="utf-8", errors="ignore") as fh:
                  lines = sum(1 for _ in fh)
                rel = os.path.relpath(path, root).replace("\\", "/")
                if lines > 200:
                  file_hits.append((rel, lines))
          failed = False
          for rel, lines in sorted(file_hits, key=lambda x: -x[1]):
              print(f"bloated-file: {rel} ({lines} lines > 200)", file=sys.stderr)
              failed = True
          if failed:
              sys.exit(1)
          print("scale-gate passed (file <=200; folder budgets live in lint:ui)")
          PY

  staging-checklist:
    name: staging-airgap-${{ inputs.app-name }}
    needs: [semantic-quality, scale-gate]
    # Reusable workflows execute in the caller repository. Personal-account
    # runners are repository-scoped, so the staging-control runner cannot pick
    # up app-repo jobs. Keep PR builds air-gapped on an ephemeral hosted runner;
    # the delivery workflow owns the real staging-control runner.
    runs-on: ubuntu-latest
    env:
      DRYL_ENV: staging
      LIVE_POLL_ONLY: "1"
      CI: "true"
    steps:
      - name: Checkout app source read-only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ inputs.app-repo != '' && inputs.app-repo || format('dalexsy/{0}', inputs.app-name) }}
          ref: ${{ inputs.app-ref != '' && inputs.app-ref || github.sha }}
          path: app
          persist-credentials: false

      - name: Checkout Directory build tooling read-only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: dalexsy/directory
          ref: main
          path: directory
          persist-credentials: false

      - name: Checkout shared dryl packages read-only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: dalexsy/dryl
          ref: main
          path: dryl
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"

      - name: Build shared UI package
        working-directory: dryl/ui
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --legacy-peer-deps --include=dev --no-audit --no-fund
          npm run build:lib

      - name: Refuse production endpoints in the environment
        run: |
          set -euo pipefail
          if printenv | grep -Ei '192\.168\.178\.79|balcony\.dryl\.io|admin\.dryl\.io|https://[a-z0-9.-]+\.dryl\.io'; then
            echo "production endpoint leaked into staging environment for ${{ inputs.app-name }}"
            exit 1
          fi
          test "${DRYL_ENV}" = "staging"

      - name: Local staging build and audit (air-gapped)
        working-directory: app/${{ inputs.app-path }}
        env:
          DRYL_ENV: staging
          BALCONY_PUBLIC_URL: http://127.0.0.1:3840
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then
            npm ci --ignore-scripts --legacy-peer-deps --include=dev --no-audit --no-fund
          else
            npm install --ignore-scripts --legacy-peer-deps --include=dev --no-audit --no-fund
          fi
          if npm run | grep -q 'lint:ui'; then npm run lint:ui; fi
          if npm run | grep -q 'build'; then npm run build; fi
          if [[ -f scripts/test-zero-trust-deploy-boundary.mjs ]]; then
            node scripts/test-zero-trust-deploy-boundary.mjs
          fi
