name: reusable-fleet-gate

on:
  workflow_call:
    secrets:
      DIRECTORY_READ_KEY:
        required: false
    inputs:
      app-name:
        description: Application folder / site id
        required: true
        type: string
      app-repo:
        required: false
        type: string
        default: ""
      app-ref:
        required: false
        type: string
        default: ""
      app-path:
        required: false
        type: string
        default: "."
      # JSON label array. Default stays hosted. Callers with a repo-scoped
      # home runner (personal accounts cannot share runners across repos) can
      # pass e.g. '["self-hosted","Linux","ARM64","household-gate"]'.
      gate-runs-on:
        description: JSON runs-on labels for commitlint + scale (caller-scoped)
        required: false
        type: string
        default: '["ubuntu-24.04"]'

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "false"
  DRYL_ENV: staging

permissions:
  contents: read

# One group per PR (or per ref for push runs). A shared per-app group made every new
# PR run cancel the in-progress run of a different PR, so merges landed on cancelled checks.
concurrency:
  group: fleet-gate-${{ inputs.app-name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  semantic-quality:
    name: commitlint-${{ inputs.app-name }}
    runs-on: ${{ fromJSON(inputs.gate-runs-on) }}
    steps:
      - name: Checkout app source read-only
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: ${{ inputs.app-repo != '' && inputs.app-repo || format('dalexsy/{0}', inputs.app-name) }}
          ref: ${{ inputs.app-ref != '' && inputs.app-ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"

      - name: Fail-closed commitlint and reject wip history
        working-directory: ${{ inputs.app-path }}
        run: |
          set -euo pipefail
          test -f package.json
          # Install outside the app tree. npm install here used to pull the app's
          # own dependencies (hundreds of packages) and hide their deprecation warns.
          TOOLS="$(mktemp -d)"
          # Runner /tmp is a small tmpfs; leaked installs filled it (ENOSPC).
          trap 'rm -rf "$TOOLS"' EXIT
          npm install --prefix "$TOOLS" --ignore-scripts --no-audit --no-fund --legacy-peer-deps \
            @commitlint/cli@21.2.2 @commitlint/config-conventional@21.2.2
          # Config lives next to the temp install so extends resolves there, not in the app.
          if [[ -f commitlint.config.cjs || -f commitlint.config.js || -f .commitlintrc.json ]]; then
            CONFIG_ARGS=()
          else
            printf '%s\n' '{"extends":["@commitlint/config-conventional"]}' \
              > "$TOOLS/.commitlintrc.json"
            CONFIG_ARGS=(--config "$TOOLS/.commitlintrc.json")
          fi
          BASE="$(git merge-base HEAD origin/main 2>/dev/null || git rev-list --max-parents=0 HEAD)"
          NODE_PATH="$TOOLS/node_modules" "$TOOLS/node_modules/.bin/commitlint" \
            "${CONFIG_ARGS[@]}" --from "${BASE}" --to HEAD
          if git log --format=%s "${BASE}..HEAD" | grep -Eiq '(^|[[:space:]])(wip|updates?)([[:space:]]|:|$)|auto-commit wip'; then
            echo "non-conventional history in ${{ inputs.app-name }}"
            git log --format=%s "${BASE}..HEAD" | grep -Ei '(^|[[:space:]])(wip|updates?)([[:space:]]|:|$)|auto-commit wip' || true
            exit 1
          fi

  scale-gate:
    name: scale-200-500-${{ inputs.app-name }}
    runs-on: ${{ fromJSON(inputs.gate-runs-on) }}
    steps:
      - name: Checkout app source read-only
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: ${{ inputs.app-repo != '' && inputs.app-repo || format('dalexsy/{0}', inputs.app-name) }}
          ref: ${{ inputs.app-ref != '' && inputs.app-ref || github.sha }}
          persist-credentials: false

      - name: Checkout canonical Go quality tools
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: dalexsy/directory
          ref: main
          path: node_modules/fleet-tools
          ssh-key: ${{ secrets.DIRECTORY_READ_KEY }}
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: node_modules/fleet-tools/tools/fleet-max-lines/go.mod
          cache: false
      - name: Enforce canonical source and directory budgets
        working-directory: ${{ inputs.app-path }}
        run: |
          set -euo pipefail
          go run -C "$GITHUB_WORKSPACE/node_modules/fleet-tools/tools/fleet-max-lines" . "$PWD"

  staging-checklist:
    name: staging-airgap-${{ inputs.app-name }}
    needs: [semantic-quality, scale-gate]
    # npm ci on hosted runners burns Actions minutes on every merge push.
    # Keep the full airgap on pull_request; push keeps commitlint + scale only.
    # Delivery / self-hosted ship owns the real staging build.
    if: github.event_name == 'pull_request'
    # Reusable workflows execute in the caller repository. Personal-account
    # runners are repository-scoped, so the staging-control runner cannot pick
    # up app-repo jobs. Hosted runners audit caller-owned source without private
    # sibling repos; the delivery workflow owns the full staging build.
    runs-on: ubuntu-24.04
    env:
      DRYL_ENV: staging
      LIVE_POLL_ONLY: "1"
      CI: "true"
    steps:
      - name: Checkout app source read-only
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: ${{ inputs.app-repo != '' && inputs.app-repo || format('dalexsy/{0}', inputs.app-name) }}
          ref: ${{ inputs.app-ref != '' && inputs.app-ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"

      - name: Refuse production endpoints in the environment
        run: |
          set -euo pipefail
          if printenv | grep -Ei '192\.168\.178\.79|balcony\.dryl\.io|admin\.dryl\.io|https://[a-z0-9.-]+\.dryl\.io'; then
            echo "production endpoint leaked into staging environment for ${{ inputs.app-name }}"
            exit 1
          fi
          test "${DRYL_ENV}" = "staging"

      - name: Hosted staging source audit (air-gapped)
        working-directory: ${{ inputs.app-path }}
        env:
          DRYL_ENV: staging
          BALCONY_PUBLIC_URL: http://127.0.0.1:3840
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then
            npm ci --ignore-scripts --legacy-peer-deps --include=dev --no-audit --no-fund
          else
            npm install --ignore-scripts --legacy-peer-deps --include=dev --no-audit --no-fund
          fi
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const pkg = JSON.parse(readFileSync("package.json", "utf8"));
          const lock = JSON.parse(readFileSync("package-lock.json", "utf8"));
          const deps = { ...pkg.dependencies, ...pkg.devDependencies };
          const locked = {
            ...lock.packages?.[""]?.dependencies,
            ...lock.packages?.[""]?.devDependencies,
          };
          for (const [name, spec] of Object.entries(deps)) {
            if (!String(spec).startsWith("file:")) continue;
            if (locked[name] !== spec) {
              throw new Error(`${name} lock mismatch: package=${spec} lock=${locked[name]}`);
            }
          }
          console.log("file dependency lock audit passed");
          NODE
          git diff --name-only origin/main...HEAD -- '*.mjs' | while read -r file; do
            if [[ -f "$file" ]]; then node --check "$file"; fi
          done
          if node -e "process.exit(require('./package.json').scripts?.['test:ocr'] ? 0 : 1)"; then
            npm run test:ocr
          fi
          if [[ -f scripts/reusable-fleet-gate.test.mjs ]]; then
            node --test scripts/reusable-fleet-gate.test.mjs
          fi
          if [[ -f scripts/test-zero-trust-deploy-boundary.mjs ]]; then
            node scripts/test-zero-trust-deploy-boundary.mjs
          fi
          if node -e "process.exit(require('./package.json').scripts?.['verify:bundles-compiled'] ? 0 : 1)"; then
            npm run verify:bundles-compiled
          fi
