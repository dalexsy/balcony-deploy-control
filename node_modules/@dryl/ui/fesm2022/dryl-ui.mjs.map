<label
  class="dryl-input-field"
  [class.inset]="layout === 'inset'"
  [class.invalid]="showInvalid"
  [attr.for]="inputId"
>
  @if (label) {
    <span class="dryl-input-label">{{ label }}</span>
  }
  <input
    #field
    class="dryl-input-control control-plain"
    [id]="inputId"
    [type]="type"
    [attr.inputmode]="inputMode"
    [attr.autocomplete]="autocomplete"
    [attr.aria-label]="ariaLabel || label || null"
    [attr.aria-describedby]="error ? errorId : null"
    [attr.aria-invalid]="showInvalid ? 'true' : null"
    [disabled]="disabled"
    [readOnly]="readonly"
    [attr.placeholder]="placeholder"
    (input)="onInput($event)"
    (paste)="onPaste($event)"
    (blur)="onTouched()"
  />
  @if (error) {
    <span class="dryl-input-error" [id]="errorId" role="alert">{{ error }}</span>
  }
</label>
