<span class="dryl-select" [class.is-embedded]="embedded" [class.is-accent-mix]="accentMix">
  @if (label) {
    <span class="dryl-select-label">{{ label }}</span>
  }
  <select
    #control
    class="dryl-select-control control-plain"
    [id]="id"
    [disabled]="disabled"
    [attr.aria-label]="ariaLabel"
    [value]="value"
    (change)="handleChange($event)"
    (blur)="handleBlur()"
  >
    @for (option of options; track option.value) {
    <option
      [value]="option.value"
      [disabled]="option.disabled"
      [selected]="option.value === value"
    >
      {{ option.label }}
    </option>
    }
  </select>
</span>
