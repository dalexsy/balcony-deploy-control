<div class="dryl-profile-menu">
  <button
    type="button"
    class="dryl-profile-menu-trigger"
    [attr.aria-expanded]="open()"
    [attr.aria-label]="displayName"
    (click)="toggle()"
  >
    {{ initial }}
  </button>

  @if (open()) {
    <div class="dryl-profile-menu-panel" (click)="close()">
      <div class="dryl-profile-menu-header">
        <span class="dryl-profile-menu-name">{{ displayName }}</span>
        <span class="dryl-profile-menu-email">{{ email }}</span>
      </div>
      <ng-content />
    </div>
  }
</div>
