<button
  [type]="type"
  [disabled]="disabled"
  [attr.class]="classAttr"
  [attr.aria-label]="ariaLabel"
  (click)="handleClick($event)"
>
  @if (leftIcon) {
    <span class="material-symbols-outlined" aria-hidden="true">{{ leftIcon }}</span>
  }
  @if (label) {
    <span class="dryl-button-label">{{ label }}</span>
  } @else if (!leftIcon && !rightIcon) {
    <span class="dryl-button-label"><ng-content /></span>
  } @else {
    <ng-content />
  }
  @if (rightIcon) {
    <span class="material-symbols-outlined" aria-hidden="true">{{ rightIcon }}</span>
  }
</button>
