<div class="dryl-modal-backdrop" (click)="backdropClick.emit()">
  <div
    #dialog
    class="dryl-modal-content"
    [class.wide]="size === 'wide'"
    [class.flush]="flushBody"
    [class.alt-title]="titleStyle === 'alt'"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="title"
    (click)="$event.stopPropagation()"
  >
    <div class="modal-header">
      <h3>{{ title }}</h3>
      <button type="button" class="close-button dryl-attention-quiet" (click)="close.emit()" aria-label="Close">
        <dryl-icon name="close"></dryl-icon>
      </button>
    </div>
    <div class="modal-body">
      <ng-content></ng-content>
    </div>
    <div *ngIf="showActions" class="modal-actions">
      <ng-content select="[modal-actions]"></ng-content>
    </div>
  </div>
</div>
