<nav class="dryl-bottom-nav" [attr.aria-label]="ariaLabel">
  @for (item of items; track item.id) {
    <a
      class="dryl-bottom-nav-item"
      [routerLink]="item.link"
      routerLinkActive="is-active"
      [routerLinkActiveOptions]="{ exact: item.link === '/' || item.link === '' }"
      [attr.aria-label]="item.label"
    >
      <dryl-icon [name]="item.icon" size="small" />
      <span class="dryl-bottom-nav-label">{{ item.label }}</span>
    </a>
  }
</nav>
