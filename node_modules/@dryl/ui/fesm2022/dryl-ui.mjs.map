<div class="dryl-chip-shelf" [class.open]="open()">
  <div
    #panel
    class="panel"
    [id]="panelId"
    [attr.aria-hidden]="!open()"
    [attr.inert]="open() ? null : ''"
    (touchstart.capture)="gestureStart($event)"
    (touchmove.capture)="gestureMove($event)"
    (touchend.capture)="gestureEnd($event)"
    (wheel.capture)="gestureWheel($event)"
  >
    <ng-content select="[drylChipShelfPanel]" />
  </div>
  <ng-content />
  @if (showTrigger()) {
    <button
      #trigger
      type="button"
      class="trigger"
      [class.active]="open()"
      [attr.aria-expanded]="open()"
      [attr.aria-controls]="panelId"
      [attr.aria-label]="label()"
      (click)="toggle()"
    >
      <ng-content select="[drylChipShelfLabel]" />
    </button>
  }
</div>
