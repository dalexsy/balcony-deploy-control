<label class="dryl-checkbox" [class.is-disabled]="disabled">
  <input
    class="dryl-checkbox-input"
    type="checkbox"
    [checked]="checked"
    [disabled]="disabled"
    (change)="onInputChange($event)"
  />
  <span class="dryl-checkbox-mark" aria-hidden="true"></span>
  @if (label) {
    <span class="dryl-checkbox-label">{{ label }}</span>
  }
</label>
