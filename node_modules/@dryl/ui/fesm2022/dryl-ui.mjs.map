<span
  #trigger
  class="tooltip-trigger"
  (mouseenter)="handleMouseEnter()"
  (mouseleave)="handleMouseLeave()"
  (focusin)="handleFocusIn()"
  (focusout)="handleFocusOut($event)"
>
  <ng-content></ng-content>
</span>

<div
  #tooltip
  *ngIf="hasContent"
  class="tooltip"
  role="tooltip"
  [class.is-open]="isOpen"
  [class.is-positioned]="tooltipPosition()"
  [attr.aria-hidden]="!isOpen"
  [class.tooltip-top]="resolvedPlacement() === 'top'"
  [class.tooltip-bottom]="resolvedPlacement() === 'bottom'"
  [class.tooltip-left]="resolvedPlacement() === 'left'"
  [class.tooltip-right]="resolvedPlacement() === 'right'"
  [style.left.px]="tooltipPosition()?.left"
  [style.top.px]="tooltipPosition()?.top"
  [style.--tooltip-arrow-x]="tooltipPosition()?.arrowX"
  [style.--tooltip-arrow-y]="tooltipPosition()?.arrowY"
>
  {{ text }}
</div>
