<div
  class="dryl-content-placeholder"
  [style.min-block-size]="minHeight"
  [class.loading]="loading"
  [attr.role]="ariaLabel ? 'status' : null"
  [attr.aria-label]="ariaLabel || null"
>
  @if (loading) {
    <span class="dryl-content-placeholder-spinner" aria-hidden="true"></span>
  }
</div>
