<span
  class="dryl-skeleton"
  [class.dryl-skeleton-text]="variant === 'text'"
  [class.dryl-skeleton-title]="variant === 'title'"
  [class.dryl-skeleton-image]="variant === 'image'"
  [class.dryl-skeleton-avatar]="variant === 'avatar'"
  [class.dryl-skeleton-button]="variant === 'button'"
  [class.dryl-skeleton-chip]="variant === 'chip'"
  [class.dryl-skeleton-input]="variant === 'input'"
  [style.inline-size]="width || null"
  [style.block-size]="height || null"
  role="status"
  [attr.aria-label]="ariaLabel || null"
  aria-busy="true"
></span>
